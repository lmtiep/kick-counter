name: KickCounter
options:
  bundleIdPrefix: com.lmtiep
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LUNA_CONTENT_PREVIEW: "NO"
packages:
  KickCore:
    path: Packages/KickCore
  KickData:
    path: Packages/KickData
targets:
  KickCounter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: KickCore
      - package: KickData
      - target: KickCounterWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Luna Mom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LunaContentPreview: $(LUNA_CONTENT_PREVIEW)
        # Phase 15: the .lunamom backup file. iOS copies an opened file into the app.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Luna Mom Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.lmtiep.kickcounter.backup]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lmtiep.kickcounter.backup
            UTTypeDescription: Luna Mom Backup
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [lunamom]
        UIAppFonts:
          - BeVietnamPro-Light.ttf
          - BeVietnamPro-Regular.ttf
          - BeVietnamPro-Medium.ttf
          - BeVietnamPro-SemiBold.ttf
          - BeVietnamPro-Bold.ttf
    entitlements:
      path: App/KickCounter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lmtiep.kickcounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KickCounterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: App/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: KickCore
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Luna Mom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/KickCounterWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lmtiep.kickcounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KickCounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: KickCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter.uitests
schemes:
  KickCounter:
    build:
      targets:
        KickCounter: all
        KickCounterUITests: [test]
    test:
      targets:
        - KickCounterUITests
