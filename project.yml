name: KickCounter
options:
  bundleIdPrefix: com.lmtiep
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LUNA_CONTENT_PREVIEW: "NO"
packages:
  KickCore:
    path: Packages/KickCore
  KickData:
    path: Packages/KickData
targets:
  KickCounter:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: KickCore
      - package: KickData
      - target: KickCounterWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Luna Mom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, vi]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LunaContentPreview: $(LUNA_CONTENT_PREVIEW)
        # Phase 15: the .lunamom backup file. iOS copies an opened file into the app.
        LSSupportsOpeningDocumentsInPlace: false
        CFBundleDocumentTypes:
          - CFBundleTypeName: Luna Mom Backup
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [com.lmtiep.kickcounter.backup]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.lmtiep.kickcounter.backup
            UTTypeDescription: Luna Mom Backup
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [lunamom]
        # 1.1 widget: `lunamom://today` and `lunamom://kicks` (WidgetLink).
        CFBundleURLTypes:
          - CFBundleURLName: com.lmtiep.kickcounter.widget
            CFBundleURLSchemes: [lunamom]
        UIAppFonts:
          - BeVietnamPro-Light.ttf
          - BeVietnamPro-Regular.ttf
          - BeVietnamPro-Medium.ttf
          - BeVietnamPro-SemiBold.ttf
          - BeVietnamPro-Bold.ttf
    entitlements:
      path: App/KickCounter.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lmtiep.kickcounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  KickCounterWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
      - path: App/Assets.xcassets
        buildPhase: resources
      # Widgets/FruitArt.xcassets (inside Widgets) holds copies of the app's `Fruit-W##.imageset`
      # folders (a KickCore test keeps them identical), so the widget does not carry the fetus art.
      - path: App/Fonts/BeVietnamPro-Regular.ttf
        buildPhase: resources
      - path: App/Fonts/BeVietnamPro-Medium.ttf
        buildPhase: resources
      - path: App/Fonts/BeVietnamPro-SemiBold.ttf
        buildPhase: resources
      - path: App/Fonts/BeVietnamPro-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: KickCore
      - package: KickData
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Luna Mom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BeVietnamPro-Regular.ttf
          - BeVietnamPro-Medium.ttf
          - BeVietnamPro-SemiBold.ttf
          - BeVietnamPro-Bold.ttf
    entitlements:
      path: Widgets/KickCounterWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.lmtiep.kickcounter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter.widgets
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  # Renders the widget views to PNG (no host app: it needs the App Group), see WidgetPreviewRenderTests.
  KickCounterWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WidgetTests
      - Widgets/Home
      - Shared/L10n.swift
      - Shared/AppLocale.swift
      - Shared/Localizable.xcstrings
      - Widgets/FruitArt.xcassets
      - path: App/Fonts/BeVietnamPro-Regular.ttf
        buildPhase: resources
      - path: App/Fonts/BeVietnamPro-Medium.ttf
        buildPhase: resources
      - path: App/Fonts/BeVietnamPro-SemiBold.ttf
        buildPhase: resources
      - path: App/Fonts/BeVietnamPro-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: KickCore
      - package: KickData
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter.widgettests
        GENERATE_INFOPLIST_FILE: YES
  KickCounterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: KickCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lmtiep.kickcounter.uitests
schemes:
  KickCounter:
    build:
      targets:
        KickCounter: all
        KickCounterUITests: [test]
    test:
      targets:
        - KickCounterUITests
        - KickCounterWidgetTests
