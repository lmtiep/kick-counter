name: TestFlight
on:
  workflow_dispatch:
    inputs:
      content_preview:
        description: "Show content still awaiting the doctor's review (internal testing only)"
        type: boolean
        default: false
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Install App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
      - name: Archive and upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
          BUILD_NUMBER: ${{ github.run_number }}
          CONTENT_PREVIEW: ${{ inputs.content_preview && '1' || '0' }}
        run: scripts/release.sh
      # Archiving creates a throwaway Apple Development certificate on this runner;
      # revoke it so they don't pile up to Apple's per-team limit.
      - name: Revoke this run's development certificate
        if: always()
        continue-on-error: true
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography
          scripts/revoke-ci-dev-certs.py
      - name: Remove API key
        if: always()
        run: rm -rf ~/private_keys
