name: CI
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      CI_SHARD_INDEX: ${{ matrix.shard }}
      CI_SHARD_TOTAL: 3
    # The full UI suite is split over the three shards (~25–35 min each); scoped runs and
    # pushes to main use shard 1 only, and the other shards exit at once (scripts/ci.sh).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Run quality gate
        run: scripts/ci.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: build/screenshots
          if-no-files-found: ignore
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ matrix.shard }}
          path: build/KickCounter.xcresult
          if-no-files-found: ignore
